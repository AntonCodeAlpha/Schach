<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligentes Schachspiel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 0;
            padding: 20px;
            color: #fff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        h1 {
            text-align: center;
            color: #e94560;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .board-container {
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        
        .chessboard {
            width: 560px;
            height: 560px;
            border: 3px solid #e94560;
            border-radius: 8px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 0;
            background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .square {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            user-select: none;
        }
        
        .square.light {
            background-color: #f0d9b5;
        }
        
        .square.dark {
            background-color: #b58863;
        }
        
        .square.selected {
            background-color: #7fc97f !important;
            box-shadow: inset 0 0 0 3px #4a7c4a;
        }
        
        .square.possible-move {
            background-color: #7fc97f !important;
        }
        
        .square.possible-move::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgba(74, 124, 74, 0.6);
            border-radius: 50%;
        }
        
        .square.check {
            background-color: #ff6b6b !important;
            animation: checkPulse 1s infinite;
        }
        
        @keyframes checkPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .piece {
            transition: transform 0.2s ease;
            z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .piece:hover {
            transform: scale(1.1);
        }
        
        .controls {
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-width: 250px;
        }
        
        .status {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.1em;
            border: 1px solid #e94560;
        }
        
        .btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        
        .btn:hover {
            background: #c73e54;
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .move-history {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .move-history h4 {
            margin: 0 0 10px 0;
            color: #e94560;
        }
        
        .move-list {
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .difficulty {
            margin: 15px 0;
        }
        
        .difficulty label {
            display: block;
            margin-bottom: 5px;
            color: #e94560;
        }
        
        select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e94560;
            background: #16213e;
            color: #fff;
            font-size: 16px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        .stat-item {
            background: #16213e;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            flex: 1;
            margin: 0 2px;
        }
        
        .promotion-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .promotion-options {
            background: #0f3460;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            gap: 10px;
        }
        
        .promotion-option {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            cursor: pointer;
            background: #16213e;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        
        .promotion-option:hover {
            background: #e94560;
            transform: scale(1.1);
        }
    </style>
</head>
